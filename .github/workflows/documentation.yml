name: Publish documentation

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          fetch-depth: 0

      - name: Install DocSprout
        run: |
          python3 -m venv .docsprout
          .docsprout/bin/python -m pip install --disable-pip-version-check "https://github.com/ikelaiah/docsprout/archive/refs/tags/v1.1.2.zip"

      - name: Validate documentation
        run: |
          .docsprout/bin/python -m docsprout check
          .docsprout/bin/python -m docsprout audit --strict

      - name: Determine release label
        id: version
        run: |
          release="${{ github.event.release.tag_name }}"
          release="${release#v}"
          if [ -z "$release" ]; then release="preview"; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build documentation
        run: |
          .docsprout/bin/python -m docsprout build \
            --output site \
            --release "${{ steps.version.outputs.release }}" \
            --offline-archive "artifacts/stringkit-fp-docs-${{ steps.version.outputs.release }}.zip"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Upload offline documentation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stringkit-fp-docs-${{ steps.version.outputs.release }}
          if-no-files-found: error
          path: |
            artifacts/stringkit-fp-docs-${{ steps.version.outputs.release }}.zip
            artifacts/stringkit-fp-docs-${{ steps.version.outputs.release }}.zip.sha256

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
