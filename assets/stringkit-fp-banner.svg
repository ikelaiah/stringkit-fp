<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">StringKit-FP</title>
  <desc id="desc">A colourful yarn-inspired banner for the StringKit-FP string toolkit.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#183b56"/>
    </linearGradient>
    <radialGradient id="yarn" cx="32%" cy="25%" r="78%">
      <stop offset="0" stop-color="#ffb08b"/>
      <stop offset=".32" stop-color="#ff765d"/>
      <stop offset=".72" stop-color="#e84d47"/>
      <stop offset="1" stop-color="#b72f3a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#061825" flood-opacity=".3"/>
    </filter>
    <clipPath id="yarn-ball"><circle cx="170" cy="183" r="101"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <path d="M0 286C132 234 187 330 323 286S533 246 655 300s241 36 351-30 145-46 194-28v118H0Z" fill="#0b2236" opacity=".65"/>
  <circle cx="1070" cy="75" r="140" fill="#286080" opacity=".2"/>
  <circle cx="1115" cy="295" r="85" fill="#ffd166" opacity=".08"/>

  <!-- The loose end begins beneath the ball, then emerges from its edge. -->
  <path d="M244 226c74 17 42 80 119 80 47 0 46-41 90-40 30 1 40 23 55 39" fill="none" stroke="#922c37" stroke-width="11" stroke-linecap="round"/>
  <path d="M244 226c74 17 42 80 119 80 47 0 46-41 90-40 30 1 40 23 55 39" fill="none" stroke="#ff795f" stroke-width="6" stroke-linecap="round"/>

  <!-- Yarn ball -->
  <g filter="url(#shadow)">
    <circle cx="176" cy="190" r="101" fill="#091d2d" opacity=".25"/>
    <circle cx="170" cy="183" r="101" fill="url(#yarn)"/>
    <g clip-path="url(#yarn-ball)" fill="none" stroke-linecap="round">
      <path d="M53 111c56-10 141 69 237 32M47 145c61-19 139 49 247 9M48 181c68-22 145 35 246-4M57 217c68-17 140 31 223-11M79 250c50-4 108 24 165-15" stroke="#a82d38" stroke-width="9" opacity=".72"/>
      <path d="M56 103c67 7 123 66 231 31M48 136c76 0 127 61 240 8M51 173c72-9 137 50 241-2M59 209c62-12 127 44 226-6M75 244c61-2 110 29 178-14" stroke="#ff9b78" stroke-width="4" opacity=".75"/>
      <path d="M89 70c-8 69 28 116 19 214M132 64c-25 69 21 123 14 225M183 63c-32 68 16 128 11 225M230 83c-47 60-12 122-12 205" stroke="#b52e3a" stroke-width="8" opacity=".52"/>
      <path d="M108 77c-11 66 22 125 15 208M158 72c-26 69 20 124 12 214M207 77c-38 58-7 128-10 206" stroke="#ffb08b" stroke-width="3" opacity=".62"/>
    </g>
    <circle cx="170" cy="183" r="96" fill="none" stroke="#ffd0b6" stroke-width="2" opacity=".4"/>
    <ellipse cx="133" cy="113" rx="32" ry="17" fill="#fff0df" opacity=".16" transform="rotate(-30 133 113)"/>
  </g>

  <!-- Code tokens -->
  <g fill="none" stroke="#ffd166" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <path d="M505 146l-25 24 25 24"/>
    <path d="M560 146l25 24-25 24"/>
    <path d="M540 140l-16 61"/>
  </g>
  <g fill="#78d5c6">
    <circle cx="444" cy="126" r="5"/><circle cx="462" cy="111" r="3"/><circle cx="466" cy="138" r="3"/>
  </g>

  <!-- Copy -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="625" y="132" fill="#ffd166" font-size="20" font-weight="700" letter-spacing="4">FREE PASCAL STRING UTILITIES</text>
    <text x="620" y="200" fill="#ffffff" font-size="65" font-weight="800" letter-spacing="-2">StringKit-FP</text>
    <text x="625" y="242" fill="#c9e3ef" font-size="25" font-weight="400">The complete toolkit for working with text.</text>
  </g>

</svg>
